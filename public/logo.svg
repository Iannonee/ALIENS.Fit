<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" fill="none">
  <!-- Left outer plate -->
  <rect x="8" y="20" width="18" height="56" rx="4" fill="#1a1a1a" stroke="#39ff14" stroke-width="2.5"/>
  <!-- Left inner collar -->
  <rect x="26" y="30" width="12" height="36" rx="3" fill="#39ff14"/>
  <!-- Left bar -->
  <line x1="38" y1="48" x2="118" y2="48" stroke="#39ff14" stroke-width="5" stroke-linecap="round"/>

  <!-- Right bar -->
  <line x1="162" y1="48" x2="242" y2="48" stroke="#39ff14" stroke-width="5" stroke-linecap="round"/>
  <!-- Right inner collar -->
  <rect x="242" y="30" width="12" height="36" rx="3" fill="#39ff14"/>
  <!-- Right outer plate -->
  <rect x="254" y="20" width="18" height="56" rx="4" fill="#1a1a1a" stroke="#39ff14" stroke-width="2.5"/>

  <!-- Lightning bolt (center) -->
  <path d="M148 10 L132 52 L143 52 L132 86 L168 44 L156 44 Z" fill="#39ff14"/>

  <!-- ALIENS text (white, above green line) -->
  <text x="140" y="106" font-family="Space Grotesk, Arial Black, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle" letter-spacing="8">ALIENS</text>

  <!-- Green divider line -->
  <line x1="20" y1="114" x2="260" y2="114" stroke="#39ff14" stroke-width="2" stroke-linecap="round"/>

  <!-- FIT text (neon green, below line) -->
  <text x="140" y="140" font-family="Space Grotesk, Arial Black, sans-serif" font-size="26" font-weight="700" fill="#39ff14" text-anchor="middle" letter-spacing="8">FIT</text>

  <!-- TRACK YOUR GAINS (small tagline) -->
  <text x="140" y="162" font-family="Space Grotesk, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#39ff14" text-anchor="middle" letter-spacing="3.5" opacity="0.75">TRACK YOUR GAINS</text>
</svg>
